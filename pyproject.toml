[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroback"
version = "2.0.0"
description = "Closed-loop, alpha-phase-locked visual stimulation for OpenBCI. Research and teaching software, not a medical device."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abril Herrlein" }]
keywords = ["EEG", "OpenBCI", "closed-loop", "alpha", "neurofeedback", "phase-locked stimulation", "BCI", "BrainFlow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Development Status :: 4 - Beta",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
hardware = ["brainflow>=5.12", "pyserial>=3.5"]
figures = ["matplotlib>=3.7", "pillow>=10"]
dev = ["pytest>=7", "httpx>=0.27"]
all = ["neuroback[app,hardware,figures,dev]"]

[project.scripts]
neuroback = "neuroback.cli:main"

[project.urls]
Repository = "https://github.com/abrilcode/neuroback"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuroback.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
